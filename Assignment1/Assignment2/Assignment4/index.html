<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Task Manager</h1>

        <p class="subtitle">
            Manage Your Daily Study Tasks
        </p>

        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
            >

            <button id="addButton">
                Add Task
            </button>

        </div>

        <div class="task-info">

            <span>
                Total Tasks:
                <strong id="totalTasks">0</strong>
            </span>

            <span>
                Completed:
                <strong id="completedTasks">0</strong>
            </span>

        </div>

        <div id="taskList"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
